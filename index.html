<style>
:root {
  --bg: #f4f4f6;
  --surface: #ffffff;
  --surface-2: #e9e9ee;
  --surface-3: #dcdce3;
  --text: #15161a;
  --muted: #6b6d76;
  --faint: #9a9ca5;
  --line: rgba(20, 20, 30, 0.09);
  --accent: #2f6fde;
  --accent-text: #ffffff;
  --accent-soft: #dfe8fb;
  --accent-ink: #1f56b8;
  --op: #e3e9f6;
  --op-ink: #1f4fa6;
  --danger: #c4372f;
  --unit: #8a4b00;
  --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
  --radius: 14px;
  --key-h: clamp(40px, 6.4dvh, 58px);
  --gap: 6px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1013;
    --surface: #1c1d22;
    --surface-2: #26272e;
    --surface-3: #31323a;
    --text: #f1f1f4;
    --muted: #9b9da7;
    --faint: #6d6f78;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #4d8bf5;
    --accent-text: #ffffff;
    --accent-soft: #1d2b45;
    --accent-ink: #9cc0ff;
    --op: #22314d;
    --op-ink: #b4cdfa;
    --danger: #ff6b61;
    --unit: #f0b35c;
    --key-shadow: none;
  }
}

:root[data-theme="dark"] {
  --bg: #0f1013;
  --surface: #1c1d22;
  --surface-2: #26272e;
  --surface-3: #31323a;
  --text: #f1f1f4;
  --muted: #9b9da7;
  --faint: #6d6f78;
  --line: rgba(255, 255, 255, 0.08);
  --accent: #4d8bf5;
  --accent-text: #ffffff;
  --accent-soft: #1d2b45;
  --accent-ink: #9cc0ff;
  --op: #22314d;
  --op-ink: #b4cdfa;
  --danger: #ff6b61;
  --unit: #f0b35c;
  --key-shadow: none;
}

/* page selection colour (cyan, as the app icon) */
:root { --tab: #0e7f99; --tab-text: #ffffff; --tab-soft: #ddf3f7; --tab-soft-text: #0a5a6d; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --tab: #22d3ee; --tab-text: #05252d; --tab-soft: #0c2f37; --tab-soft-text: #8be9f7; }
}
:root[data-theme="dark"] { --tab: #22d3ee; --tab-text: #05252d; --tab-soft: #0c2f37; --tab-soft-text: #8be9f7; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  touch-action: manipulation;
}

body { overflow: hidden; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible, .expr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Layout: stacked on phones held upright, side by side otherwise */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px));
}

.calc-pane {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.pad-pane { flex: none; }
.side-pane { display: none; }

/* Top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px 0 0;
  flex: none;
}

.topbar .title {
  flex: none;
  margin-right: auto;
  text-align: left;
  border-radius: 10px;
  padding-top: 6px;
  padding-bottom: 6px;
  padding-right: 8px;
  font-weight: 650;
  font-size: 17px;
  letter-spacing: -0.01em;
  padding-left: 6px;
}

.topbar .title span { color: var(--muted); font-weight: 500; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--muted);
  flex: none;
}

.icon-btn:active { background: var(--surface-2); }

.icon-btn svg, .key svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* History */
.history {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 6px 4px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  -webkit-overflow-scrolling: touch;
}

.history::before { content: ""; flex: 1; }

.history .empty {
  color: var(--muted);
  text-align: center;
  font-size: 15px;
  line-height: 1.5;
  padding: 12px 8px;
}

.history .empty p { margin: 0 auto 10px; max-width: 32em; }
.history .empty .try { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

.history .empty button {
  color: var(--accent-ink);
  background: var(--accent-soft);
  font-family: var(--mono);
  font-size: 13.5px;
  padding: 6px 10px;
  border-radius: 10px;
}

.entry {
  padding: 6px 0 8px;
  border-bottom: 1px solid var(--line);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.entry:last-child { border-bottom: 0; }
.entry.recalled { background: var(--tab-soft); box-shadow: inset 3px 0 0 var(--tab); border-radius: 0 10px 10px 0; padding-left: 10px; padding-right: 6px; border-bottom-color: transparent; }
.entry.recalled .in { color: var(--tab-soft-text); }

.entry .in {
  color: var(--muted);
  font-size: 15px;
  font-family: var(--mono);
  text-align: right;
  overflow-wrap: anywhere;
  padding: 2px 0;
}

.entry .out {
  font-size: 24px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  line-height: 1.25;
  padding: 2px 0;
}

.entry .out.small { font-size: 17px; }
.entry .name { color: var(--muted); font-size: 17px; margin-right: 6px; }
.entry .rid { float: left; color: var(--muted); font-size: 13px; line-height: 30px; opacity: 0.8; }
.entry.error .out { color: var(--danger); font-size: 16px; }
.entry .info { text-align: left; font-size: 15px; white-space: pre-wrap; line-height: 1.45; color: var(--text); }
.entry .info h3 { font-size: 15px; margin: 0 0 4px; color: var(--muted); font-weight: 600; }
.entry .list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; padding-top: 4px; }
.entry .in, .entry .out { border-radius: 8px; margin: 0 -6px; padding-left: 6px; padding-right: 6px; cursor: pointer; }
.entry .in:active, .entry .out:active { background: var(--surface-2); }

/* Tables (list results) */
.entry .out.tbl { font-size: 15px; line-height: 1.3; }
.entry .out.tbl:active { background: none; }
.entry .tbl-head { display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; }
.entry .tbl-head:empty { display: none; }
.entry .tbl-head .rid { float: none; margin-right: auto; line-height: 1.3; }
.tbl-wrap {
  max-width: 100%;
  max-height: clamp(170px, 30vh, 420px);
  overflow: auto;
  margin-left: auto;
  width: fit-content;
  border: 1px solid var(--line);
  border-radius: 8px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
table.vals { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.vals th, table.vals td { padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--line); }
table.vals tr:last-child td { border-bottom: 0; }
table.vals th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-2); color: var(--muted);
  font-weight: 500; font-size: 13px; vertical-align: bottom;
}
table.vals th .h { display: block; color: var(--text); font-family: var(--mono); font-size: 13px; white-space: normal; max-width: 10em; margin-left: auto; overflow-wrap: anywhere; }
table.vals th .u { display: block; color: var(--unit); }
table.vals .ix { position: sticky; left: 0; background: var(--surface-2); color: var(--muted); font-size: 12px; padding: 5px 6px; text-align: center; }
table.vals th.ix { z-index: 2; }
table.vals td[data-v] { cursor: pointer; }
table.vals td[data-v]:active { background: var(--surface-2); }
.entry .tbl-more { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

/* Plots */
.entry .out.plot { text-align: left; font-size: 14px; line-height: 1.35; cursor: default; }
.entry .out.plot:active { background: none; }
.plot-svg {
  display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto;
  touch-action: pan-y; font-family: inherit; overflow: visible;
}
.plot-svg .grid line { stroke: var(--line); stroke-width: 1; }
.plot-svg .frame { fill: none; stroke: var(--muted); stroke-opacity: 0.5; stroke-width: 1; }
.plot-svg .curves path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot-svg .bands path { fill-opacity: 0.18; stroke: none; }
.plot-svg text { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot-svg .axis-label { fill: var(--text); font-size: 12.5px; }
.plot-svg .cursor line { stroke: var(--text); stroke-opacity: 0.45; stroke-width: 1; }
.plot-svg .cursor circle { stroke: var(--surface); stroke-width: 1.5; }
.plot-legend { display: flex; flex-wrap: wrap; gap: 2px 14px; max-width: 560px; margin: 2px auto 0; }
.plot-bar { display: flex; align-items: center; gap: 6px; max-width: 560px; margin: 4px auto 0; }
.plot-bar .chip { font-size: 13px; padding: 4px 10px; min-height: 30px; }
.plot-bar .chip.on { background: var(--accent-soft); color: var(--accent-ink); }
.out.plot .lg { display: inline-flex; align-items: center; gap: 5px; }
.out.plot .lg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.out.plot .lg math { font-size: 15px; }
.plot-read { flex: 1; min-width: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.plot-read .u { color: var(--unit); }
.preview .lp { color: var(--muted); font-size: 0.8em; }
.entry .flash { animation: flash 0.5s ease; }
@keyframes flash { from { background: var(--accent-soft); } }
.hist-hint { color: var(--faint); font-size: 12.5px; text-align: center; padding: 4px 0 8px; }

.u { color: var(--unit); margin-left: 0.28em; }
.u i { font-style: italic; }
sup { font-size: 0.62em; line-height: 0; vertical-align: 0.55em; }
sub { font-size: 0.62em; line-height: 0; vertical-align: -0.28em; }
.expr sup { font-size: 0.6em; vertical-align: 0.7em; }
.expr sub, .entry .in sub { font-size: 0.65em; vertical-align: -0.3em; }
.t-f { color: var(--accent-ink); }
.pm { color: var(--muted); padding: 0 0.12em; }
.tilde { color: var(--muted); }

/* Editor: drawn by the app, never focused, so no system keyboard */
.editor {
  flex: none;
  touch-action: pan-y;
  margin: 2px 0 6px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 8px 12px 6px;
  box-shadow: 0 0 0 1px var(--line);
}

.expr {
  font-family: var(--mono);
  font-size: 22px;
  line-height: 1.3;
  min-height: 1.3em;
  max-height: calc(3 * 1.3em);
  overflow-y: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  cursor: text;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  position: relative;
}

.expr .ph { color: var(--faint); }
.expr .t-n { color: var(--text); }
.expr .t-u, .expr .t-spec { color: var(--unit); }
.expr .t-v, .entry .in .t-v { color: var(--accent-ink); }
.expr .t-f { color: var(--accent-ink); }
.expr .t-op { color: var(--muted); }
.expr .t-at { color: var(--accent); font-weight: 700; }

.caret {
  display: inline-block;
  width: 2px;
  height: 1.15em;
  margin: 0 -1px;
  vertical-align: -0.2em;
  background: var(--accent);
  border-radius: 1px;
  position: relative;
  z-index: 1;
  animation: blink 1.06s steps(1) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

.preview {
  min-height: 28px;
  margin-top: 4px;
  padding-top: 3px;
  line-height: 1.45;
  text-align: right;
  font-size: 17px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.preview.error { color: var(--danger); font-size: 14px; opacity: 0.85; }
.preview .eq { color: var(--faint); margin-right: 4px; }

/* Suggestions */
.suggest {
  flex: none;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 0 6px;
  min-height: 38px;
  scrollbar-width: none;
}

.suggest::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--line);
  font-size: 15px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.chip small { color: var(--faint); font-size: 12px; }
.chip.unit { color: var(--unit); font-weight: 550; }
.chip.conv { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
.chip.var { background: var(--tab-soft); color: var(--tab-soft-text); box-shadow: none; font-style: italic; }
.chip:active { filter: brightness(0.92); }

/* Keypad */
.keypad {
  background: var(--surface-2);
  border-radius: 20px;
  padding: 6px;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}

.tab {
  flex: 1;
  height: 34px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}

/* main tabs: a segmented control, the current page in the accent colour */
.tabs { background: var(--bg); border-radius: 12px; padding: 3px; gap: 2px; box-shadow: inset 0 0 0 1px var(--line); }
.tab { color: var(--muted); font-weight: 600; letter-spacing: 0.01em; }
.tab[aria-selected="true"] { background: var(--tab); color: var(--tab-text); font-weight: 700; box-shadow: 0 1px 3px rgb(0 0 0 / 0.18); }

.pages { height: calc(5 * var(--key-h) + 4 * var(--gap)); }

.page { display: none; height: 100%; }

.page.active {
  display: grid;
  grid-template-columns: 4fr 1fr;
  gap: var(--gap);
}

.left { min-width: 0; min-height: 0; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: var(--gap);
}

.right {
  display: grid;
  grid-template-rows: repeat(5, 1fr);
  gap: var(--gap);
  min-height: 0;
}

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  min-height: 0;
}

.key {
  min-width: 0;
  min-height: 0;
  height: 100%;
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--key-shadow);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.key.fn { background: var(--surface-3); font-size: 17px; }
.key.op { background: var(--op); color: var(--op-ink); }
.key.eq { background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 24px; }
.key.conv { background: var(--accent-soft); color: var(--accent-ink); font-weight: 650; }
.key.del { background: var(--surface-3); color: var(--text); }
.split .key { font-size: 17px; }
.key.small, .split .key.small { font-size: 15px; }
.key:active { filter: brightness(0.88); transform: scale(0.97); }
.key sup { font-size: 0.6em; }
.key.has-alt { position: relative; }
.key .alt { position: absolute; bottom: 9px; right: 12px; font-size: 20px; font-weight: 600; color: var(--muted); line-height: 1; }

/* Units and f(x) pages: full width, actions in a bottom row */
.page.wide-page.active {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.actions {
  flex: none;
  display: grid;
  grid-template-columns: repeat(var(--n, 6), 1fr);
  gap: 5px;
  height: max(36px, calc(var(--key-h) - 10px));
}

.actions .key { font-size: 19px; }
.actions .key.small { font-size: 15px; }

.fn-grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), 1fr);
  grid-auto-rows: max(38px, calc(var(--key-h) - 8px));
  gap: 5px;
  align-content: start;
  overscroll-behavior: contain;
}

.fn-grid.described { grid-auto-rows: max(44px, var(--key-h)); }
.fn-grid.fixed { grid-template-rows: repeat(var(--rows), 1fr); grid-auto-rows: 0; overflow: hidden; }
.fn-grid.fixed .key.const small { -webkit-line-clamp: 1; }
.fn-grid .key.model { background: var(--surface-3); }
.fn-grid .key.model b { color: var(--text); font-size: 15px; }
.key.eq svg { width: 26px; height: 26px; stroke-width: 2.2; }
.fn-grid .key.const b { font-size: 17px; }
.fn-grid .key.param { background: var(--surface-3); }
.fn-grid .key.param b { color: var(--text); }
.fn-note { grid-column: 1 / -1; margin: 4px 2px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.fn-note code { font-family: var(--mono); font-size: 12px; background: var(--surface); padding: 1px 4px; border-radius: 4px; }

.cats, .prefixes {
  flex: none;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}

.cats::-webkit-scrollbar, .prefixes::-webkit-scrollbar { display: none; }

.cat {
  flex: none;
  height: 26px;
  padding: 0 10px;
  border-radius: 14px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}

.cat[aria-selected="true"] { background: var(--tab-soft); color: var(--tab-soft-text); box-shadow: inset 0 0 0 1.5px var(--tab); }

.prefix {
  flex: 0 0 auto;
  min-width: 38px;
  height: 34px;
  padding: 0 4px;
  border-radius: 10px;
  background: var(--surface-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.05;
}

.prefix b { font-size: 15px; font-weight: 600; }
.prefix small { font-size: 9.5px; color: var(--muted); }
.prefix[aria-pressed="true"] { background: var(--unit); color: var(--bg); }
.prefix[aria-pressed="true"] small { color: inherit; opacity: 0.8; }
.prefix[data-prefix="k"], .prefix[data-prefix="m"] { box-shadow: inset 0 -2px 0 var(--line); }

.unit-grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: auto;
  gap: 5px;
  align-content: start;
  overscroll-behavior: contain;
}

.ghead {
  grid-column: 1 / -1;
  align-self: end;
  line-height: 1.1;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  padding: 2px 2px 0;
}

.key.unit { height: max(36px, calc(var(--key-h) - 10px)); font-size: 17px; color: var(--unit); font-weight: 550; padding: 0 2px; }
.key.unit.long { font-size: 13px; }
.key > span { display: inline-block; white-space: nowrap; }
.key.unit.off { opacity: 0.3; cursor: default; }

    this.formats = new Map();    // name -> {fn, doc}
    this.vars = new Map();       // user namespace (Q, functions, objects)
    this.defaultsystem = null;   // list of args
    this.prefixonly = true;
    this.sortunits = true;
    this.tolerant = true;
    this.digits = 15;
    this.showErrors = true;
    this.version = 0;
    this.prefixes.set("", { x: new UNum(1), doc: "" });
  }

  touch() {
    this.version++;
  }

  // -------------------------------------------------------------------
  // Definitions

  newbaseunit(name, doc = "") {
    if (this.baseunits.includes(name)) throw new UnitError(`Base unit ${name} already defined`);
    this.baseunits.push(name);
    const d = new Array(this.baseunits.length).fill(0);
    d[d.length - 1] = 1;
    this.units.set(name, new Q(1, d).withDoc(doc));
    this.touch();
  }

  newprefix(name, value, doc = "") {
    const q = value instanceof Q ? value : new Q(value);
    if (!q.pure) throw new UnitError(`Prefix ${name} must be a pure number`);
    this.prefixes.set(name, { x: q.x, doc });
    this.touch();
  }

  newunit(name, value, doc = "") {
    let q;
    if (Array.isArray(value)) {
      if (value.length !== 2) throw new UnitError(`The absolute unit ${name} is not a 2-tuple`);
      const [z, v] = value.map((t) => (t instanceof Q ? t : new Q(t)));
      this.checkCompatible(z, v);
      q = new Q(v.x, v.d, z.x.n);
    } else {
      q = value instanceof Q ? new Q(value.x, value.d, value.zero) : new Q(value);
    }
    this.units.set(name, q.withDoc(doc));
    this.touch();
  }

  newsystem(name, args, doc = "") {
    this.systems.set(name, { args: this.expandSystem(args), doc });
    this.touch();
  }

  // Expand system names within a list of @-arguments
  expandSystem(args) {
    const out = [];
    for (const raw of args) {
      const sarg = raw.trim().replace(/^\[|\]$/g, "").trim();
      if (!sarg) continue;
      const ssarg = sarg.replace(/^\*+|\*+$/g, "");
      let name = ssarg, quote = "";
      if (ssarg.length > 1 && (ssarg[0] === '"' || ssarg[0] === "'") &&
          ssarg[0] === ssarg.at(-1) && !ssarg.slice(1, -1).includes(ssarg[0])) {
        name = ssarg.slice(1, -1);
        quote = ssarg[0];
      }
      const sys = this.systems.get(name);
      if (sys) {
        let tmp = sys.args;
        if (quote === "'") tmp = tmp.map((a) => a.replaceAll('"', "'"));
        if (quote === '"') tmp = tmp.map((a) => a.replaceAll("'", '"'));
        out.push(...tmp);
        if (sarg[0] === "*" || sarg.at(-1) === "*") out.push("*");
      } else {
        out.push(sarg);
      }
    }
    return out;
  }

  // -------------------------------------------------------------------
  // Unit lookup

  // Split a unit name into [prefix, unit]; returns null if not a unit
  isunit(name) {
    if (this.units.has(name)) return ["", name];
    if (this.prefixonly && name && this.prefixes.has(name)) return [name, ""];
    if (name.endsWith("*") && this.prefixes.has(name.slice(0, -1))) return [name.slice(0, -1), ""];
    for (const k of this.prefixes.keys()) {
      if (k && name.startsWith(k) && this.units.has(name.slice(k.length))) {
        return [k, name.slice(k.length)];
      }
    }
    return null;
  }

  unitValue(name) {
    const iu = this.isunit(name);
    if (!iu) throw new UnitError(`Unknown unit '${name}'`);
    const [p, u] = iu;
    const px = this.prefixes.get(p).x;
    if (!u) return new Q(px);
    const uq = this.units.get(u);
    return new Q(px.mul(uq.x), uq.d, uq.zero);
  }

  varValue(name) {
    let v = this.vars.get(name);
    if (v && v.lazy) v = v.lazy();
    if (v instanceof Q) return v;
    if (typeof v === "number") return new Q(v);
    throw new UnitError(`Unknown variable '${name}' in unit`);
  }

  // -------------------------------------------------------------------
  // Unit algebra (used to build values of unit specifications: zero
  // points survive only for a lone unit, as in imks)

  umul(a, b) {
    let zero = false;
    if (b.pure) zero = a.zero;
    else if (a.pure) zero = b.zero;
    return new Q(a.x.mul(b.x), dimAdd(a.d, b.d), zero);
  }

  upow(a, e) {
    if (e === 1) return a;
    return new Q(a.x.pow(e), dimScale(a.d, e));
  }

  // Value represented by a unit tree
  treeValue(tree) {
    let r = new Q(1);
    for (const [u, e] of tree) {
      if (Math.abs(e) < EPS) continue;
      let x;
      if (Array.isArray(u)) x = this.treeValue(u);
      else if (u[0] === '"' || u[0] === "'") x = this.varValue(u.slice(1, -1));
      else x = this.unitValue(u);
      r = this.umul(r, this.upow(x, e));
    }
    return r;
  }

  // -------------------------------------------------------------------
  // Parsing of unit specifications, e.g. "kg m/s^2", "m/(s K)", "'c' s"

  parseUnit(spec) {
    const toks = this.lexUnit(spec);
    let pos = 0;
    const peek = () => toks[pos];
    const next = () => toks[pos++];
    const expect = (t) => {
      const k = next();
      if (!k || k.t !== t) throw new UnitError(`Syntax error in unit [${spec}]`);
      return k;
    };
    const isNum = (k) => k && k.t === "num";

    const treePow = (tree, f) => {
      if (tree.length === 1 && tree[0][1] === 1) return [[tree[0][0], f]];
      if (f === 1) return tree;
      return [[tree, f]];
    };

    const exponent = () => {
      const k = peek();
      if (k && k.t === "(") {
        next();
        const e = exponent();
        expect(")");
        return e;
      }
      const n = expect("num").v;
      if (peek() && peek().t === "numdiv") {
        next();
        return n / expect("num").v;
      }
      return n;
    };

    const atom = () => {
      const k = next();
      if (!k) throw new UnitError(`Incomplete unit [${spec}]`);
      if (k.t === "unit") {
        const iu = this.isunit(k.v);
        if (!iu) throw new UnitError(`Unknown unit '${k.v}'`);
        return { q: this.unitValue(k.v), tree: [[iu[0] + iu[1], 1]] };
      }
      if (k.t === "quoted") {
        return { q: this.varValue(k.v.slice(1, -1)), tree: [[k.v, 1]] };
      }
      if (k.t === "(") {
        const r = expr();
        expect(")");
        return r;
      }
      throw new UnitError(`Syntax error in unit [${spec}]`);
    };

    const factor = () => {
      let r = atom();
      for (;;) {
        const k = peek();
        let e;
        if (k && k.t === "^") { next(); e = exponent(); }
        else if (isNum(k)) { next(); e = k.v; }
        else break;
        r = { q: this.upow(r.q, e), tree: treePow(r.tree, e) };
      }
      return r;
    };

    const startsFactor = (k) => k && (k.t === "unit" || k.t === "quoted" || k.t === "(");

    const term = () => {
      let r = factor();
      for (;;) {
        const k = peek();
        if (k && k.t === ".") next();
        else if (!startsFactor(k)) break;
        const f = factor();
        r = { q: this.umul(r.q, f.q), tree: [...r.tree, ...f.tree] };
      }
      return r;
    };

    const expr = () => {
      let r = term();
      while (peek() && peek().t === "/") {
        next();
        const f = term();
        r = {
          q: new Q(r.q.x.div(f.q.x), dimAdd(r.q.d, f.q.d, -1)),
          tree: [...r.tree, ...f.tree.map(([u, e]) => [u, -e])],
        };
      }
      return r;
    };

    if (!toks.length) return { q: new Q(1), tree: [] };
    const r = expr();
    if (pos < toks.length) throw new UnitError(`Syntax error in unit [${spec}]`);
    return r;
  }

  lexUnit(spec) {
    const toks = [];
    let i = 0;
    const s = spec;
    while (i < s.length) {
      const c = s[i];
      if (c === " " || c === "\t" || c === "*" || c === "·") { i++; continue; }
      let m;
      if ((m = /^[-+]?\d+(\.\d+)?/.exec(s.slice(i)))) {
        toks.push({ t: "num", v: Number(m[0]) });
        i += m[0].length;
        continue;
      }
      if (c === "/") {
        toks.push({ t: /^\/\s*\d/.test(s.slice(i)) && toks.length && toks.at(-1).t === "num" ? "numdiv" : "/" });
        i++;
        continue;
      }
      if ("^().".includes(c)) {
        toks.push({ t: c });
        i++;
        continue;
      }
      if (c === "'" || c === '"') {
        const j = s.indexOf(c, i + 1);
        if (j < 0) throw new UnitError(`Unterminated quote in unit [${spec}]`);
        toks.push({ t: "quoted", v: s.slice(i, j + 1) });
        i = j + 1;
        continue;
      }
      if ((m = unitNameRe.exec(s.slice(i)))) {
        toks.push({ t: "unit", v: m[0] });
        i += m[0].length;
        continue;
      }
      throw new UnitError(`Illegal character '${c}' in unit [${spec}]`);
    }
    return toks;
  }

  // Q for a unit specification
  unit(spec) {
    return this.parseUnit(spec).q;
  }

  // -------------------------------------------------------------------
  // Physical arithmetic (zero points are taken into account)

  dimString(d) {
    const parts = [];
    for (let i = 0; i < d.length; i++) {
      const e = snap(d[i]);
      if (Math.abs(e) < EPS) continue;
      const [p, q] = fraction(e);
      parts.push(this.baseunits[i] + (e === 1 ? "" : "^" + (q === 1 ? p : p + "/" + q)));
    }
    return parts.length ? parts.join(" ") : "1";
  }

  checkCompatible(a, b, where = "") {
    if (dimEq(a.d, b.d)) return;
    if (this.tolerant && (a.x.n === 0 || b.x.n === 0)) return;
    throw new UnitError(`Incompatible units${where ? " in " + where : ""}: [${this.dimString(a.d)}] and [${this.dimString(b.d)}]`);
  }

  checkPure(a, where = "") {
    if (a.pure || (this.tolerant && a.x.n === 0)) return a.relative().x;
    throw new UnitError(`${where ? where + ": e" : "E"}xpected a pure number, got [${this.dimString(a.d)}]`);
  }

  add(a, b) {
    this.checkCompatible(a, b, "sum");
    if (a.zero !== false && b.zero !== false) {
      throw new UnitError("Cannot add two absolute quantities (use ~ to make one relative)");
    }
    const d = a.x.n === 0 && b.x.n !== 0 ? b.d : a.d;
    return new Q(a.x.add(b.x), d, a.zero !== false ? a.zero : b.zero);
  }

  sub(a, b) {
    this.checkCompatible(a, b, "difference");
    const offset = (a.zero || 0) - (b.zero || 0);
    const abs = (a.zero !== false ? 1 : 0) - (b.zero !== false ? 1 : 0);
    if (abs < 0) throw new UnitError("Cannot subtract an absolute quantity from a relative one");
    const d = a.x.n === 0 && b.x.n !== 0 ? b.d : a.d;
    if (abs) return new Q(a.x.sub(b.x), d, offset);
    return new Q(a.x.sub(b.x).add(offset), d);
  }

  mul(a, b) {
    if (a.zero !== false && !b.pure) a = a.relative();
    if (b.zero !== false && !a.pure) b = b.relative();
    let zero = false;
    if (a.zero !== false && b.pure) zero = a.zero;
    else if (b.zero !== false && a.pure) zero = b.zero;
    if (a.zero !== false && b.zero !== false) { a = a.relative(); b = b.relative(); zero = false; }
    return new Q(a.x.mul(b.x), dimAdd(a.d, b.d), zero);
  }

  div(a, b) {
    b = b.relative();
    if (a.zero !== false && !b.pure) a = a.relative();
    return new Q(a.x.div(b.x), dimAdd(a.d, b.d, -1), a.zero);
  }

  pow(a, b) {
    const e = this.checkPure(b, "exponent");
    if (e.n === 1 && e.exact) return a;
    a = a.relative();
    if (!a.pure && !e.exact) throw new UnitError("Uncertain exponent of a quantity with units");
    return new Q(a.x.pow(e), dimScale(a.d, e.n));
  }

  neg(a) {
    return new Q(a.x.neg(), a.d, a.zero === false ? false : -a.zero);
  }

  tilde(a) {
    if (a.zero !== false) return new Q(a.x.add(a.zero), a.d);
    return new Q(a.x, a.d, 0);
  }

  compare(a, b) {
    this.checkCompatible(a, b, "comparison");
    const x = a.relative().x.n, y = b.relative().x.n;
    return x < y ? -1 : x > y ? 1 : 0;
  }

  // -------------------------------------------------------------------
  // Conversion: the @ operator (port of imks' Value.set_units)

  isQuoted(u) {
    return u.length > 1 && (u[0] === "'" || u[0] === '"') && u[0] === u.at(-1) &&
      !u.slice(1, -1).includes(u[0]);
  }

  convert(q, rawArgs) {
    const args = this.expandSystem(rawArgs);
    const s = new Q(q.x, q.d, q.zero, { tree: null, prefixes: [], format: null });
    s.doc = q.doc;
    if (args.length === 1 && this.formats.has(args[0])) {
      s.show.format = args[0];
      return s;
    }
    // Separate prefixes from units and values
    let nunits = 0, nvalues = 0;
    const us = [];
    // the * wildcard selects engineering prefixes (powers of 1000)
    const seen = new Set();
    const allPrefixes = [...this.prefixes.keys()].filter((k) => {
      const e = Math.log10(this.prefixes.get(k).x.n);
      const r = Math.round(e);
      if (Math.abs(e - r) > 1e-9 || r % 3 !== 0 || seen.has(r)) return false;
      seen.add(r);
      return true;
    });
    for (let u of args) {
      if (u.endsWith("*")) {
        if (u === "*") s.show.prefixes.push(...allPrefixes);
        else {
          if (!this.prefixes.has(u.slice(0, -1))) throw new UnitError(`Unknown prefix '${u.slice(0, -1)}'`);
          s.show.prefixes.push(u.slice(0, -1));
        }
      } else if (u === ".") {
        s.show.prefixes.push("");
      } else if (this.isQuoted(u)) {
        us.push(u);
        nvalues++;
      } else {
        if (u[0] === "*") {
          s.show.prefixes.push(...allPrefixes);
          u = u.slice(1);
        }
        const iu = this.isunit(u);
        if (iu && iu[1] === "") s.show.prefixes.push(u);
        else {
          nunits++;
          us.push(u);
        }
      }
    }
    // Parse units and values
    const trees = [], vals = [];
    for (const u of us) {
      if (this.isQuoted(u)) {
        trees.push([[u, 1]]);
        vals.push(this.varValue(u.slice(1, -1)));
      } else {
        const p = this.parseUnit(u);
        trees.push(p.tree);
        vals.push(p.q);
      }
    }
    const nb = this.baseunits.length;
    const dimsOf = (v) => Array.from({ length: nb }, (_, i) => dimGet(v.d, i));
    if (trees.length === 1 && q.pure && vals[0].pure) {
      s.show.tree = trees[0];
      return s;
    }
    let maxrank = false;
    if (trees.length === 0) maxrank = true;
    else if (trees.length <= nb) {
      const m = vals.map(dimsOf);
      if (Math.abs(det(gram(m))) > 1e-7) maxrank = true;
    }
    let tree = null;
    if (maxrank) {
      const newTrees = trees.slice(), newVals = vals.slice();
      for (let n = 0; newTrees.length < nb && n < nb; n++) {
        const b = this.baseunits[n];
        const cand = [...newVals, this.units.get(b)].map(dimsOf);
        if (Math.abs(det(gram(cand))) > 1e-7) {
          newTrees.push([[b, 1]]);
          newVals.push(this.units.get(b));
        }
      }
      const m = newVals.map(dimsOf);
      const mt = Array.from({ length: nb }, (_, i) => m.map((r) => r[i]));
      const x = solve(mt, dimsOf(q));
      if (!x) throw new UnitError("Cannot solve unit conversion");
      tree = this.combine(newTrees, x.map(snap));
    } else {
      if (nunits === 1 && nvalues > 0 && !this.isQuoted(us[0])) {
        // A specific unit in a natural system, e.g. 6.2e34 @ [m|planck]
        const target = vals[0];
        const ratio = this.div(q.plain(), target.relative());
        const conv = this.convert(ratio, us.slice(1));
        const flat = this.applyShow(conv);
        const out = this.mul(flat, target.relative());
        out.show = { tree: [...(flat.show?.tree || []), ...trees[0]], prefixes: s.show.prefixes, format: null };
        out.doc = q.doc;
        return out;
      }
      if (q.pure) {
        s.show.tree = null;
        return s;
      }
      const target = dimsOf(q);
      const cols = vals.map(dimsOf);
      const maxLevel = Math.min(cols.length, nb);
      const key = `${this.version}|${us.join("|")}|${target.join(",")}`;
      this.searchCache ||= new Map();
      if (this.searchCache.has(key)) tree = this.searchCache.get(key);
      else search: for (let level = 1; level <= maxLevel; level++) {
        for (const c of combinations(cols.length, level)) {
          const r = lstsq(c.map((i) => cols[i]), target);
          if (r && r.residual < 1e-7 && Math.min(...r.x.map(Math.abs)) > 1e-5) {
            tree = this.combine(c.map((i) => trees[i]), r.x.map(snap));
            break search;
          }
        }
      }
      if (this.searchCache.size > 500) this.searchCache.clear();
      this.searchCache.set(key, tree);
      if (!tree) s.show.failed = true;
    }
    s.show.tree = tree;
    return this.applyShow(s);
  }

  // Build the unit tree sum(trees[i] * exps[i]), positive exponents first
  combine(trees, exps) {
    let pairs = trees.map((t, i) => [t, exps[i]]).filter(([, e]) => Math.abs(e) > EPS);
    if (this.sortunits) pairs = [...pairs.filter(([, e]) => e > 0), ...pairs.filter(([, e]) => e < 0)];
    const out = [];
    for (const [t, e] of pairs) {
      if (t.length === 1 && t[0][1] === 1) out.push([t[0][0], e]);
      else if (e === 1) out.push(...t);
      else out.push([t, e]);
    }
    return out;
  }

  // Remove double quoted units from the display tree, transforming the value
  applyShow(s) {
    if (!s.show || !s.show.tree) return s;
    const { factor, tree } = this.removeVariableUnits(s.show.tree);
    if (!factor) return s;
    const out = this.div(s, factor);
    out.show = { ...s.show, tree };
    out.doc = s.doc;
    // Fix rounding in dimensions
    out.d = out.d.map((e) => (Math.abs(e) < 1e-9 ? 0 : e));
    return out;
  }

  removeVariableUnits(tree) {
    let factor = null;
    const out = [];
    for (const [u, e] of tree) {
      if (Array.isArray(u)) {
        const r = this.removeVariableUnits(u);
        if (r.tree.length) out.push([r.tree, e]);
        if (r.factor) {
          const f = this.upow(r.factor, e);
          factor = factor ? this.umul(factor, f) : f;
        }
      } else if (u[0] === '"' && u.at(-1) === '"') {
        const f = this.upow(this.varValue(u.slice(1, -1)).plain(), e);
        factor = factor ? this.umul(factor, f) : f;
      } else out.push([u, e]);
    }
    return { factor, tree: out };
  }

  // -------------------------------------------------------------------
  // Display

  // Returns {num: UNum, tree, tilde, text} or {text} for formats
  display(q) {
    let tilde = false, num, tree;
    if (q.show && q.show.format) {
      const f = this.formats.get(q.show.format);
      if (f) {
        try {
          return { text: f.fn(q, this), format: true };
        } catch (e) {
          if (!(e instanceof UnitError)) throw e;
        }
      }
    }
    if (q.show && q.show.tree) {
      tree = q.show.tree;
      const u0 = this.treeValue(tree);
      if (q.zero !== false) {
        num = q.x.add(q.zero - (u0.zero || 0)).div(u0.x);
      } else {
        if (u0.zero !== false) tilde = true;
        num = q.x.div(u0.x);
      }
    } else if (this.defaultsystem && !q.pure) {
      const c = this.convert(q.plain(), this.defaultsystem);
      if (q.show && q.show.prefixes.length) c.show.prefixes = q.show.prefixes;
      if (c.show && c.show.tree) return this.display(c);
      num = q.x;
      tree = this.baseTree(q.d);
    } else {
      num = q.zero !== false ? q.x.add(q.zero) : q.x;
      tree = this.baseTree(q.d);
    }
    if (q.show && q.show.prefixes && q.show.prefixes.length) {
      ({ num, tree } = this.applyPrefix(num, tree, q.show.prefixes));
    }
    return { num, tree, tilde };
  }

  baseTree(d) {
    const t = [];
    for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > EPS) t.push([this.baseunits[i], d[i]]);
    if (this.sortunits) return [...t.filter(([, e]) => e > 0), ...t.filter(([, e]) => e < 0)];
    return t;
  }

  applyPrefix(num, tree, prefixes) {
    let myunit = null, myexp = 1, fprefix = "";
    for (const [u, e] of tree) {
      if (typeof u === "string" && Math.abs(e) > EPS && !this.isQuoted(u)) {
        myunit = u;
        myexp = e;
        break;
      }
    }
    if (myunit !== null) {
      fprefix = this.isunit(myunit)?.[0] || "";
      if (fprefix) num = num.mul(Math.pow(this.prefixes.get(fprefix).x.n, myexp));
    } else {
      myunit = "";
      fprefix = "";
      tree = [["", 1]];
    }
    const avalue = Math.abs(num.n);
    if (avalue === 0 || !isFinite(avalue)) {
      return { num, tree: myunit === "" ? [] : tree.map(([u, e]) => [u === myunit ? myunit : u, e]) };
    }
    const base = myunit.slice(fprefix.length);
    const ok = (k) => (base !== "" || !this.units.has(k)) && this.prefixes.has(k) && (base === "" || this.units.has(base));
    const pv = (k) => Math.pow(this.prefixes.get(k).x.n, myexp);
    let dexes = prefixes.filter(ok).filter((k) => pv(k) <= avalue * (1 + 1e-12)).map((k) => [k, avalue / pv(k)]);
    if (!dexes.length) dexes = prefixes.filter(ok).map((k) => [k, -avalue / pv(k)]);
    if (!dexes.length) return { num, tree };

  makeBuiltins() {
    const env = this.env;
    const b = {};
    for (const f of pureFuncs) {
      b[f] = (a) => new Q(ufuncs[f](env.checkPure(a, f)));
    }
    b.ln = b.log;
    b.sqrt = (a) => { a = a.relative(); return new Q(ufuncs.sqrt(a.x), dimScale(a.d, 0.5)); };
    b.cbrt = (a) => { a = a.relative(); return new Q(ufuncs.cbrt(a.x), dimScale(a.d, 1 / 3)); };
    b.abs = (a) => { a = a.relative(); return new Q(a.x.abs(), a.d); };
    for (const f of ["floor", "ceil", "trunc"]) {
      b[f] = (a) => { a = a.relative(); return new Q(ufuncs[f](a.x), a.d); };
    }
    b.round = (a, n) => {
      a = a.relative();
      const k = n ? Math.pow(10, env.checkPure(n, "round").n) : 1;
      return new Q(new UNum(Math.round(a.x.n * k) / k), a.d);
    };
    b.atan2 = (y, x) => {
      env.checkCompatible(y, x, "atan2");
      return new Q(atan2(y.relative().x, x.relative().x));
    };
    // lists: min(list), or elementwise min(list, 0)
    const values = (fn, xs) => {
      if (xs.length !== 1 || !Array.isArray(xs[0])) throw new CalcError(`${fn} expects one list`);
      if (!xs[0].length) throw new CalcError(`${fn}: the list is empty`);
      if (xs[0].some(Array.isArray)) throw new CalcError(`${fn}: expected a list of values, not a table`);
      return xs[0];
    };
    // hypot(x, y, …) or hypot(list), the length of a vector
    const hypot = (...xs) => {
      let s = env.mul(xs[0], xs[0]);
      for (const x of xs.slice(1)) s = env.add(s, env.mul(x, x));
      return b.sqrt(s);
    };
    b.hypot = (...xs) => (xs.length === 1 && Array.isArray(xs[0]) ? hypot(...values("hypot", xs)) : broadcast(hypot, xs));

    // vectors: lists of components with compatible units
    const vec = (fn, v, n = 0) => {
      if (!Array.isArray(v) || v.some(Array.isArray)) throw new CalcError(`${fn}: expected vectors, as (1, 2, 3) m`);
      if (!v.length) throw new CalcError(`${fn}: the vector is empty`);
      if (n && v.length !== n) throw new CalcError(`${fn}: expected vectors of ${n} components, got ${v.length}`);
      for (const c of v) env.checkCompatible(c, v[0], fn);
      return v;
    };
    const pair = (fn, xs, n = 0) => {
      if (xs.length !== 2) throw new CalcError(`${fn} expects two vectors`);
      const [a, c] = [vec(fn, xs[0], n), vec(fn, xs[1], n)];
      if (a.length !== c.length) throw new CalcError(`${fn}: vectors of different lengths: ${a.length} and ${c.length}`);
      return [a, c];
    };
    const dot = (a, c) => a.map((x, i) => env.mul(x, c[i])).reduce((s, t) => env.add(s, t));
    const cross = (a, c) => [[1, 2], [2, 0], [0, 1]].map(([i, j]) => env.sub(env.mul(a[i], c[j]), env.mul(a[j], c[i])));
    b.dot = (...xs) => dot(...pair("dot", xs));
    b.cross = (...xs) => cross(...pair("cross", xs, 3));
    b.norm = (...xs) => {
      if (xs.length !== 1) throw new CalcError("norm expects one vector");
      return hypot(...vec("norm", xs[0]));
    };
    // atan2(|a × c|, a · c), accurate also for nearly parallel vectors
    b.angle = (...xs) => {
      const [a, c] = pair("angle", xs);
      const d = dot(a, c);
      let s;
      if (a.length === 3) s = hypot(...cross(a, c));
      else if (a.length === 2) s = b.abs(env.sub(env.mul(a[0], c[1]), env.mul(a[1], c[0])));
      else {
        // Lagrange's identity: |a × c|² = |a|² |c|² − (a · c)²
        const s2 = env.sub(env.mul(dot(a, a), dot(c, c)), env.mul(d, d));
        s = b.sqrt(s2.x.n < 0 ? env.mul(s2, new Q(0)) : s2);
      }
      return b.atan2(s, d);
    };
    const extreme = (fn, sgn) => (...xs) => {
      const pick = (...ys) => ys.reduce((a, c) => (env.compare(c, a) * sgn > 0 ? c : a));
      if (xs.length === 1 && Array.isArray(xs[0])) return pick(...values(fn, xs));
      return broadcast(pick, xs);
    };
    b.min = extreme("min", -1);
    b.max = extreme("max", 1);
    b.sum = (...xs) => {
      if (xs.length !== 1) throw new CalcError("Usage: sum(list) or sum(f(k), k, a, b)");
      return values("sum", xs).reduce((a, c) => env.add(a, c));
    };
    b.mean = (...xs) => env.div(b.sum(...xs), new Q(xs[0].length));
    b.len = (...xs) => {
      if (xs.length !== 1 || !Array.isArray(xs[0])) throw new CalcError("len expects one list");
      return new Q(xs[0].length);
    };
    const count = (fn, n) => {
      if (Array.isArray(n)) throw new CalcError(`${fn}: the number of values must be a number`);
      const k = env.checkPure(n, `${fn} (n)`).n;
      if (!(Number.isInteger(k) && k >= 2 && k <= 10000)) throw new CalcError(`${fn}: n must be a whole number from 2 to 10000`);
      return k;
    };
    const ends = (fn, a, c) => {
      if (Array.isArray(a) || Array.isArray(c) || !(a instanceof Q) || !(c instanceof Q)) throw new CalcError(`Usage: ${functionDocs[fn].replace(/^[^:]*:\s*/, "")}`);
      env.checkCompatible(a, c, fn);
    };
    b.linspace = (a, c, n) => {
      ends("linspace", a, c);
      const k = count("linspace", n), w = env.sub(c, a);
      return Array.from({ length: k }, (_, i) => (i === k - 1 ? c : env.add(a, env.mul(w, new Q(i / (k - 1))))));
    };
    b.logspace = (a, c, n) => {
      ends("logspace", a, c);
      const k = count("logspace", n), r = env.div(c, a);
      if (!(env.checkPure(r, "logspace").n > 0)) throw new CalcError("logspace: a and b must have the same sign and not be zero");
      return Array.from({ length: k }, (_, i) => (i === k - 1 ? c : env.mul(a, env.pow(r, new Q(i / (k - 1))))));
    };
    // plot(ys) or plot(xs, ys); plot(f(x), x, a, b) is evaluated in calculus
    b.plot = (...xs) => {
      if (xs.length < 1 || xs.length > 2) throw new CalcError(`Usage: ${functionDocs.plot.replace(/^[^:]*:\s*/, "")}`);
      const ys = xs.at(-1);
      if (!Array.isArray(ys)) throw new CalcError("plot: give lists of values, or plot(f(x), x, a, b)");
      const series = ys.some(Array.isArray) ? ys.map((s) => (Array.isArray(s) ? s : [s])) : [ys];
      const n = series[0].length;
      if (series.some((s) => s.length !== n)) throw new CalcError("plot: the curves have different lengths");
      const x = xs.length === 2 ? xs[0] : Array.from({ length: n }, (_, i) => new Q(i + 1));
      if (!Array.isArray(x) || x.some(Array.isArray)) throw new CalcError("plot: the x values must be a list");
      if (x.length !== n) throw new CalcError(`plot: ${x.length} x values for ${n} y values`);
      return makePlot(env, x, series.map((s) => s.map((q) => (q instanceof Q && isFinite(q.x.n) ? q : null))), {});
    };
    b.fraction = (a, c) => env.div(a, c);
    b.nominal = (a) => new Q(a.x.nominal(), a.d, a.zero);
    b.err = (a) => new Q(new UNum(a.x.std), a.d);
    // evaluated in evalNode; listed here for help and suggestions
    for (const f of CALCULUS) b[f] = b[f] || (() => { throw new CalcError(`Usage: ${functionDocs[f].replace(/^[^:]*:\s*/, "")}`); });
    return b;
  }

  // -------------------------------------------------------------------
  // Evaluation

  lookup(name, scope) {
    if (scope && scope.has(name)) return scope.get(name);
    const env = this.env;
    if (env.vars.resolve) name = env.vars.resolve(name);
    if (env.vars.has(name)) {
      const v = env.vars.get(name);
      if (v && v.lazy) return v.lazy();
      return v;
    }
    if (name === "pi") return new Q(Math.PI);
    if (name === "tau") return new Q(2 * Math.PI);
    if (name === "inf") return new Q(Infinity);
    if (name === "nan") return new Q(NaN);
    if (name === "const") return this.const;
    if (env.isunit(name)) return env.unitValue(name);
    throw new CalcError(`Unknown name '${name}'`);
  }

  evalNode(node, scope = null) {
    const env = this.env;
    const ev = (n) => this.evalNode(n, scope);
    const asQ = (v) => {
      if (v instanceof Q) return v;
      if (typeof v === "number") return new Q(v);
      if (Array.isArray(v)) throw new CalcError("Expected a quantity, not a list");
      throw new CalcError("Expected a quantity");
    };
    // a quantity, or a list of them (possibly nested)
    const val = (v) => (Array.isArray(v) ? v.map(val) : asQ(v));
    switch (node.t) {
      case "num":
        return new Q(node.x);
      case "str":
        return node.v;
      case "name":
        return this.lookup(node.v, scope);
      case "tuple":
        return node.items.map(ev);
      case "unit": {
        const target = ev(node.target);
        if (target instanceof ConstDict) {
          const key = this.evalNode(parse(node.raw, env), scope);
          if (typeof key !== "string") throw new CalcError("Constant names are strings");
          return target.get(key);
        }
        const u = env.unit(node.raw);
        return broadcast((t) => env.mul(t, u), [val(target)]);
      }
      case "un":
        return broadcast((a) => {
          if (node.op === "-") return env.neg(a);
          if (node.op === "~") return env.tilde(a);
          return a;
        }, [val(ev(node.a))]);
      case "bin":
        return broadcast((a, b) => {
          switch (node.op) {
            case "+": return env.add(a, b);
            case "-": return env.sub(a, b);
            case "*": return env.mul(a, b);
            case "/": return env.div(a, b);
            case "^": return env.pow(a, b);
            case "±": {
              env.checkCompatible(a, b, "±");
              return new Q(a.x.add(UNum.uncertain(0, b.relative().x.n)), a.d, a.zero);
            }
          }
          throw new CalcError("Cannot evaluate expression");
        }, [val(ev(node.a)), val(ev(node.b))]);
      case "eq":
        throw new CalcError("An equation (=) can only be an argument of solve");
      case "call": {
        if (isCalculus(node) && !(scope && scope.has(node.f)) && !(env.vars.get(node.f) || {}).fn) {
          return this.calculus(node, scope);
        }
        const args = node.args.map(ev);
        let f = scope && scope.has(node.f) ? scope.get(node.f) : env.vars.get(node.f);
        // user functions see lists as they are, and apply to them elementwise
        // as far as their body does
        if (f && f.fn) return this.callUser(f.fn, args.map(val));
        f = this.builtins[node.f];
        if (!f && args.length === 1 && !(scope && scope.has(node.f))) {
          // a value followed by parentheses multiplies: pi (2 m)^2
          let v = null;
          try { v = this.lookup(node.f, scope); } catch { v = null; }
          if (v instanceof Q || Array.isArray(v)) return broadcast((a, b) => env.mul(a, b), [val(v), val(args[0])]);
        }
        if (!f) throw new CalcError(`Unknown function '${node.f}'`);
        if (!args.length) throw new CalcError(`${node.f} needs an argument`);
        if (LIST_FNS.has(node.f)) return f(...args.map(val));
        return broadcast(f, args.map(val));
      }
      case "convert": {
        const spec = splitSpec(node.spec);
        if (!spec.length) throw new CalcError("Missing unit after @");
        return broadcast((a) => env.convert(a, spec), [val(ev(node.a))]);
      }
    }
    throw new CalcError("Cannot evaluate expression");
  }

  callUser(fn, args) {
    if (args.length !== fn.params.length) {
      throw new CalcError(`Function expects ${fn.params.length} argument(s)`);
    }
    const scope = new Map(fn.params.map((p, i) => [p, args[i]]));
    if (++this.depth > 200) { this.depth = 0; throw new CalcError("Recursion too deep"); }
    try {
      return this.evalNode(fn.body, scope);
    } finally {
      this.depth--;
    }
  }

  // solve, integrate, diff: the first argument is evaluated many times,
  // with the variable named by the second one bound in a local scope
  calculus(node, scope) {
    const env = this.env;
    const name = node.f;
    const [body, v, ...rest] = node.args;
    const [least, most] = { solve: [0, 2], integrate: [2, 2], diff: [1, 2], plot: [2, 2], sum: [2, 2] }[name];
    const usage = () => new CalcError(`Usage: ${functionDocs[name].replace(/^[^:]*:\s*/, "")}`);
    if (!body || !v || v.t !== "name" || rest.length < least || rest.length > most) throw usage();
    const expr = body.t === "eq" && name === "solve" ? { t: "bin", op: "-", a: body.a, b: body.b } : body;
    const limits = rest.map((n) => {
      const q = this.evalNode(n, scope);
      if (!(q instanceof Q) && !(Array.isArray(q) && name !== "plot")) throw usage();
      return q;
    });
    // the units the limits are written in, as in solve(…, x, 1 Gpc)
    const spec = rest.map((n) => (n.t === "unit" ? n.raw : n.t === "convert" ? n.spec : null)).find(Boolean);
    const shown = (q) => {
      if (!spec) return q;
      try { return env.convert(q, splitSpec(spec)); } catch { return q; }
    };
    // every evaluation reuses the same uncertainty sources, so that
    // x (2 ± 0.1) is one uncertain factor at all points
    const local = new Map(scope || []);
    const id0 = sourceMark();
    let idMax = id0, element = null;
    const f = (x) => {
      sourceReset(id0);
      local.set(v.v, x);
      try {
        let r = this.evalNode(expr, local);
        if (Array.isArray(r) && name !== "plot" && name !== "sum") {
          // an expression giving a list is solved (integrated…) per element
          if (element === null) throw new ListValue(r.length);
          r = r[element];
        }
        const ok = (q) => q instanceof Q || (Array.isArray(q) && q.length && q.every((y) => y instanceof Q));
        if (!ok(r)) throw new CalcError(`${name}: the expression is not a quantity`);
        return r;
      } finally {
        idMax = Math.max(idMax, sourceMark());
      }
    };
    const one = (...lims) => {
      try {
        return CALCULUS_FNS[name](env, f, lims, name);
      } catch (e) {
        if (!(e instanceof ListValue)) throw e;
        const out = [];
        for (element = 0; element < e.n; element++) out.push(CALCULUS_FNS[name](env, f, lims, name));
        element = null;
        return out;
      }
    };
    try {
      if (name === "plot") {
        const tuple = body.t === "convert" ? body.a : body;
        return calcPlot(env, f, limits, { heads: tuple.t === "tuple" ? tuple.items : [body], xname: v.v, shown });
      }
      const r = broadcast(one, limits);
      return name === "solve" ? broadcast(shown, [r]) : r;
    } finally {
      sourceReset(Math.max(idMax, sourceMark()));
    }
  }

  evalExpr(src) {
    const node = parse(normalize(src), this.env);
    if (!node) throw new CalcError("Empty expression");
    return this.evalNode(node);
  }

  // -------------------------------------------------------------------
  // Statements and commands.  Returns
  //   {kind: "value", q, name?}  for expressions and assignments
  //   {kind: "info", title, text} for help and commands
  //   {kind: "list", title, items: [{name, doc}]}
  //   {kind: "none"}

  run(line) {
    this.depth = 0;
    const trimmed = line.trim();
    if (!trimmed) return { kind: "none" };
    try {
      if (trimmed[0] === "%") return this.command(trimmed);
      let m;
      if ((m = /^(.*?)\s*!!$/.exec(trimmed))) return this.search(m[1]);
      if ((m = /^(.+?)\s*!$/.exec(trimmed))) return this.info(m[1]);
      if (trimmed === "!") return { kind: "info", title: "Help", text: "help" };
      const { code, doc } = splitComment(trimmed);
      return this.runCode(code, doc);
    } catch (e) {
      return this.wrapError(e);
    }
  }

  wrapError(e) {
    if (e instanceof UnitError || e instanceof CalcError) return { kind: "error", message: e.message };
    if (e instanceof RangeError) return { kind: "error", message: "Recursion too deep" };
    throw e;
  }

  runCode(code, doc = "") {
    try {
      const node = parse(normalize(code), this.env);
      if (!node) return { kind: "none" };
      if (node.t === "assign") {
        let v = this.evalNode(node.value);
        if (v instanceof PlotData) throw new CalcError("A plot cannot be assigned to a variable");
        if (v instanceof Q && doc) v = v.withDoc(doc);
        this.env.vars.set(node.name, v);
        this.env.touch();
        return { kind: "value", q: v, name: node.name, define: true };
      }
      if (node.t === "def") {
        this.env.vars.set(node.name, { fn: { params: node.params, body: node.body }, doc, src: code.trim() });
        this.env.touch();
        return { kind: "info", title: `${node.name}(${node.params.join(", ")})`, text: "Function defined", define: true };
      }
      let v = this.evalNode(node);
      if (v instanceof PlotData) return { kind: "plot", plot: v };
      if (v instanceof Q || (Array.isArray(v) && isQList(v))) {
        if (doc && v instanceof Q) v = v.withDoc(doc);
        this.env.vars.set("ans", v);
        return { kind: "value", q: v };
      }
      if (Array.isArray(v)) return { kind: "info", title: "Tuple", text: v.map((x) => (x instanceof Q ? this.env.format(x) : String(x))).join(", ") };
      if (typeof v === "string") return { kind: "info", title: "String", text: v };
      if (v instanceof ConstDict) return this.search("", true);
      return { kind: "info", title: "", text: String(v) };
    } catch (e) {
      return this.wrapError(e);
    }
  }

  // Run a whole definition file (lines starting with # are comments)
  runScript(text, { strict = false } = {}) {
    const errors = [];
    text.split(/\r?\n/).forEach((line, n) => {
      if (/^\s*(#|$)/.test(line)) return;
      const r = this.run(line);
      if (r.kind === "error") {
        errors.push(`line ${n + 1}: ${r.message}`);
        if (strict) throw new CalcError(errors.at(-1));
      }
    });
    return errors;
  }

  command(line) {
    const env = this.env;
    const m = /^%(\w+)\s*([\s\S]*)$/.exec(line);
    if (!m) throw new CalcError("Invalid command");
    const cmd = m[1];
    const { code, doc } = splitComment(m[2]);
    const arg = code.trim();
    const defn = () => {
      const parts = arg.split("=");
      if (parts.length < 2) throw new CalcError(`Usage: %${cmd} name=value`);
      const value = parts.pop();
      return { names: parts.map((p) => p.trim()), value: value.trim() };
    };
    const evalDef = (src) => {
      const node = parse(normalize(src), env);
      return this.evalNode(node);
    };
    switch (cmd) {
      case "newbaseunit":
      case "newbasecurrency":
        env.newbaseunit(arg, doc);
        if (cmd === "newbasecurrency") env.basecurrency = arg;
        return { kind: "none", define: true };
      case "newprefix": {
        const { names, value } = defn();
        const v = evalDef(value);
        for (const n of names) env.newprefix(n, v, doc);
        return { kind: "none", define: true };
      }
      case "newunit": {
        const { names, value } = defn();
        const v = evalDef(value);
        for (const n of names) env.newunit(n, v, doc);
        return { kind: "none", define: true };
      }
      case "newsystem": {
        const { names, value } = defn();
        for (const n of names) env.newsystem(n, splitSpec(value), doc);
        return { kind: "none", define: true };
      }
      case "defaultsystem":
        env.defaultsystem = arg ? env.expandSystem(splitSpec(arg)) : null;
        env.defaultsystemName = arg;
        return { kind: "none", define: true };
      case "let": {
        const r = this.runCode(arg, doc);
        return r.kind === "error" ? r : { ...r, define: true };
      }
      case "lazy":
      case "lazyvalue": {
        const { names, value } = defn();
        const node = parse(normalize(value), env);
        let busy = false;
        const lazy = () => {
          if (busy) throw new CalcError(`Recursive definition of ${names[0]}`);
          busy = true;
          try {
            const v = this.evalNode(node);
            return v instanceof Q ? v.withDoc(doc) : v;
          } finally {
            busy = false;
          }
        };
        for (const n of names) env.vars.set(n, { lazy, doc, src: value });
        env.touch();
        return { kind: "none", define: true };
      }
      case "delunit": env.units.delete(arg); env.touch(); return { kind: "none", define: true };
      case "delprefix": env.prefixes.delete(arg); env.touch(); return { kind: "none", define: true };
      case "delsystem": env.systems.delete(arg); env.touch(); return { kind: "none", define: true };
      case "del":
      case "dellazy": env.vars.delete(arg); env.touch(); return { kind: "none", define: true };
      case "compatible":
        return this.compatibleList(arg);
      case "uinfo":
        return /^-a\s+/.test(arg) ? this.search(arg.replace(/^-a\s+/, "")) : this.info(arg);
      default:
        throw new CalcError(`Unknown command %${cmd}`);
    }
  }

  // Dimensions of a unit spec or an expression
  dimsOf(arg) {
    const s = arg.trim();
    if (/^\[.*\]$/.test(s)) return this.env.unit(s.slice(1, -1));
    const v = this.evalExpr(s);
    if (!(v instanceof Q)) throw new CalcError("Not a quantity");
    return v;
  }

  // Units and variables compatible with a quantity
  compatible(q, { variables = true } = {}) {
    const env = this.env;
    const units = [], vars = [];
    for (const [k, v] of env.units) if (dimEq(v.d, q.d)) units.push(k);
    if (variables) {
      for (const [k, v] of env.vars) {
        if (k === "ans") continue;
        if (v instanceof Q && dimEq(v.d, q.d)) vars.push(k);
      }
    }
    return { units, vars };
  }

  compatibleList(arg) {
    const q = this.dimsOf(arg);
    const { units, vars } = this.compatible(q);
    const items = [
      ...units.map((u) => ({ name: u, doc: firstLine(this.env.units.get(u).doc), kind: "unit" })),
      ...vars.map((v) => ({ name: v, doc: firstLine(this.env.vars.get(v).doc), kind: "variable" })),
    ];
    return { kind: "list", title: `Compatible with [${this.env.dimString(q.d)}]`, items };
  }

  // Help on a name (the imks ! operator)
  info(name) {
    const env = this.env;
    name = name.trim();
    const out = [];
    const fmt = (q) => (Array.isArray(q) ? "(" + q.map(fmt).join(", ") + ")" : env.format(q));
    if (env.systems.has(name)) {
      const s = env.systems.get(name);
      out.push({ title: `${name} — unit system`, text: (s.doc ? s.doc + "\n\n" : "") + "[" + s.args.join("|") + "]" });
    }
    if (env.units.has(name)) {
      const u = env.units.get(name);
      const base = env.baseunits.includes(name);
      const absolute = u.zero !== false && u.zero !== 0;
      let text = u.doc || name;
      if (!base) {
        text += "\n\n1[" + name + "] = " + fmt(new Q(u.x, u.d));
        if (absolute) text += `\nZero point: ${fmt(new Q(u.zero, u.d))}`;
      } else text += "\n\nBase unit";
      out.push({ title: `${name} — unit`, text });
    } else if (env.isunit(name) && env.isunit(name)[0] && env.isunit(name)[1]) {
      const [p, u] = env.isunit(name);
      out.push({
        title: `${name} — prefixed unit`,
        text: `${firstLine(env.prefixes.get(p).doc) || p} + ${firstLine(env.units.get(u).doc) || u}\n\n1[${name}] = ${fmt(env.unitValue(name).plain())}`,
      });
    }
    if (env.prefixes.has(name) && name) {
      const p = env.prefixes.get(name);
      out.push({ title: `${name} — prefix`, text: (p.doc || name) + "\n\n" + formatUNum(p.x, env.digits) });
    }
    if (env.vars.has(name)) {
      const v = env.vars.get(name);
      if (v.fn) out.push({ title: `${name} — function`, text: (v.doc ? v.doc + "\n\n" : "") + v.src });
      else {
        const val = v.lazy ? v.lazy() : v;
        out.push({
          title: `${name} — ${v.lazy ? "lazy variable" : "variable"}`,
          text: ((val.doc || v.doc) ? (val.doc || v.doc) + "\n\n" : "") + (val instanceof Q || Array.isArray(val) ? fmt(val) : String(val)) +
            (v.lazy ? `\n\n= ${v.src}` : ""),
        });
      }
    }
    if (this.builtins[name]) out.push({ title: `${name} — function`, text: functionDocs[name] || name });
    if (env.formats.has(name)) out.push({ title: `${name} — format`, text: env.formats.get(name).doc });
    if (this.const.has(name)) out.push({ title: `const["${name}"]`, text: this.const.get(name).doc + "\n\n" + fmt(this.const.get(name)) });
    if (!out.length) return { kind: "error", message: `No information on '${name}'` };
    return { kind: "info", title: out.map((o) => o.title).join(" · "), text: out.map((o) => o.text).join("\n\n———\n\n"), entries: out };
  }

  // Search documentation strings (the imks !! operator)
  search(text, constsOnly = false) {
    const env = this.env;
    const t = text.trim().toLowerCase();
    const items = [];
    const match = (name, doc) => !t || name.toLowerCase().includes(t) || (doc || "").toLowerCase().includes(t);
    if (!constsOnly) {
      for (const [k, v] of env.units) if (match(k, v.doc)) items.push({ name: k, doc: firstLine(v.doc), kind: "unit" });
      for (const [k, v] of env.prefixes) if (k && match(k, v.doc)) items.push({ name: k, doc: firstLine(v.doc), kind: "prefix" });
      for (const [k, v] of env.systems) if (match(k, v.doc)) items.push({ name: k, doc: firstLine(v.doc), kind: "system" });
      for (const [k, v] of env.vars) if (k !== "ans" && match(k, v.doc)) items.push({ name: k, doc: firstLine(v.doc), kind: v.fn ? "function" : "variable" });
    }
    for (const k of this.const.keys()) if (match(k, "")) items.push({ name: `const["${k}"]`, doc: k, kind: "constant" });
    return { kind: "list", title: t ? `Matching “${text.trim()}”` : "Constants", items };
  }
}

// ---------------------------------------------------------------------
// Calculus: solve, integrate, diff
//
// f(x) evaluates the expression for a quantity x. Bracketing, adaptive
// subdivision and convergence use nominal values only (Monte Carlo off);
// the result is then computed with quantities, so that the errors of the
// limits and of everything in the expression propagate. In Monte Carlo
// mode integrals and derivatives reuse the final nodes for every sample,
// and solve finds the root of every sample.

const EPS = Number.EPSILON;

// The variable as plain numbers: u stands for new Q(u, d, zero), with the
// dimensions and zero point of the limits; returns the limits as UNum
function varFrame(env, qs, name) {
  const finite = qs.filter((q) => isFinite(q.x.n));
  const ref = finite.find((q) => q.x.n !== 0) || finite[0] || new Q(0);
  const z = ref.zero === false ? 0 : UNum.of(ref.zero).n;
  const us = qs.map((q) => {
    if (!isFinite(q.x.n) && q.pure) return q.x;
    env.checkCompatible(q, ref, name);
    return q.relative().x.sub(z);
  });
  return { d: ref.d, us, mk: (u) => new Q(u, ref.d, ref.zero) };
}

// with nominal values only (bracketing and adaptivity)
function nominally(fn) {
  const on = MC.on;
  MC.on = false;
  try {
    return fn();
  } finally {
    MC.on = on;
  }
}

// a result whose variable is a pure number keeps the display units of the
// expression: integrate(D_L(z), z, 0, 1) is still in Mpc
function keepShow(r, q, d) {
  return dimIsZero(d) && q && q.show && dimEq(q.d, r.d) ? new Q(r.x, r.d, r.zero, q.show) : r;
}

const sgn = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);

// Search outwards from u0 for a sign change of g: {lo, hi, glo, ghi} or null
function bracketRoot(g, u0) {
  const g0 = g(u0);
  if (!isFinite(g0)) return null;
  if (g0 === 0) return { lo: u0, hi: u0, glo: 0, ghi: 0 };
  const safe = (u) => { try { return g(u); } catch { return NaN; } };
  let step = Math.abs(u0) * 0.1 || 0.1;
  let r = u0, gr = g0, l = u0, gl = g0, right = true, left = true;
  for (let k = 0; k < 200 && (right || left); k++, step *= 2) {
    if (right) {
      const u = u0 + step, v = safe(u);
      if (!isFinite(v)) right = false;
      else if (sgn(v) !== sgn(g0)) return { lo: r, hi: u, glo: gr, ghi: v };
      else { r = u; gr = v; }
    }
    if (left) {
      const u = u0 - step, v = safe(u);
      if (!isFinite(v)) left = false;
      else if (sgn(v) !== sgn(g0)) return { lo: u, hi: l, glo: v, ghi: gl };
      else { l = u; gl = v; }
    }
  }
  return null;
}

// Brent's method on a bracket with fa, fb of opposite signs
function brent(f, a, b, fa, fb) {
  if (fa === 0) return a;
  if (fb === 0) return b;
  const xtol = 1e-15 * Math.abs(b - a);
  let c = b, fc = fb, d = b - a, e = d;
  for (let it = 0; it < 300; it++) {
    if (sgn(fb) === sgn(fc)) { c = a; fc = fa; d = e = b - a; }
    if (Math.abs(fc) < Math.abs(fb)) { a = b; b = c; c = a; fa = fb; fb = fc; fc = fa; }
    const tol = 2 * EPS * Math.abs(b) + 0.5 * xtol;
    const xm = 0.5 * (c - b);
    if (Math.abs(xm) <= tol || fb === 0) return b;
    if (Math.abs(e) >= tol && Math.abs(fa) > Math.abs(fb)) {
      // inverse quadratic interpolation, or secant
      const s = fb / fa;
      let p, q;
      if (a === c) {
        p = 2 * xm * s;
        q = 1 - s;
      } else {
        const t = fa / fc, r = fb / fc;
        p = s * (2 * xm * t * (t - r) - (b - a) * (r - 1));
        q = (t - 1) * (r - 1) * (s - 1);
      }
      if (p > 0) q = -q;
      p = Math.abs(p);
      if (2 * p < Math.min(3 * xm * q - Math.abs(tol * q), Math.abs(e * q))) { e = d; d = p / q; }
      else { d = xm; e = d; }
    } else {
      d = xm;
      e = d;
    }
    a = b;
    fa = fb;
    b += Math.abs(d) > tol ? d : (xm > 0 ? tol : -tol);
    fb = f(b);
  }
  return b;
}

// The root of every Monte Carlo sample: G(xs) gives the samples of the
// expression at the sample values xs. Each sample keeps its own bracket,
// widened where the nominal one does not hold its root, and is refined by
// secant steps that fall back to bisection.
function solveSamples(G, root, lo, hi, slope, name) {
  const N = MC.N;
  const LO = new Float64Array(N).fill(lo), HI = new Float64Array(N).fill(hi);
  let gl = G(LO), gh = G(HI);
  const open = (i) => isNaN(gl[i]) || isNaN(gh[i]) || sgn(gl[i]) * sgn(gh[i]) > 0;
  for (let k = 0; k < 60; k++) {
    let any = false;
    for (let i = 0; i < N; i++) {
      if (!open(i)) continue;
      any = true;
      const w = 1.6 * (HI[i] - LO[i]);
      if (Math.abs(gl[i]) < Math.abs(gh[i]) || !isFinite(gh[i])) LO[i] -= w;
      else HI[i] += w;
    }
    if (!any) break;
    gl = G(LO);
    gh = G(HI);
  }
  let missing = 0;
  for (let i = 0; i < N; i++) if (open(i)) missing++;
  if (missing) throw new CalcError(`${name}: ${missing} of ${N} Monte Carlo samples have no root`);

  const xtol = 1e-15 * Math.abs(hi - lo);
  const done = new Uint8Array(N);
  let X = new Float64Array(N).fill(root), gx = G(X), Xp = null, gp = null;
  for (let it = 0; it < 100; it++) {
    let all = true;
    const Xn = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      Xn[i] = X[i];
      if (done[i]) continue;
      if (gx[i] === 0) { done[i] = 1; continue; }
      if (sgn(gx[i]) === sgn(gl[i])) { LO[i] = X[i]; gl[i] = gx[i]; } else { HI[i] = X[i]; gh[i] = gx[i]; }
      const inv = Xp ? (X[i] - Xp[i]) / (gx[i] - gp[i]) : 1 / slope;
      let xn = X[i] - gx[i] * inv;
      const a = Math.min(LO[i], HI[i]), b = Math.max(LO[i], HI[i]);
      if (!(xn > a && xn < b) || it >= 40) xn = 0.5 * (a + b);
      const tol = 4 * EPS * Math.abs(xn) + xtol;
      if (Math.abs(xn - X[i]) <= tol || b - a <= tol) done[i] = 1;
      else all = false;
      Xn[i] = xn;
    }
    if (all) return Xn;
    Xp = X;
    gp = gx;
    X = Xn;
    gx = G(X);
  }
  return X;
}

function calcSolve(env, f, limits, name) {
  const fr = varFrame(env, limits.length ? limits : [new Q(1)], name);
  if (fr.us.some((u) => !isFinite(u.n))) throw new CalcError(`${name}: the starting value and the range must be finite`);
  const g = (u) => f(fr.mk(u)).relative();
  const gn = (u) => g(u).x.n;
  const { root, lo, hi, gq, slope } = nominally(() => {
    let br;
    if (fr.us.length === 2) {
      const [a, b] = fr.us.map((u) => u.n);
      br = { lo: a, hi: b, glo: gn(a), ghi: gn(b) };
      if (sgn(br.glo) * sgn(br.ghi) > 0) throw new CalcError(`${name}: no sign change between the two limits`);
      if (!isFinite(br.glo) || !isFinite(br.ghi)) throw new CalcError(`${name}: the expression is not finite at a limit`);
    } else {
      br = bracketRoot(gn, fr.us[0].n);
      if (!br) throw new CalcError(`${name}: no root found; give a range, as in solve(f(x) = y, x, a, b)`);
    }
    const root = brent(gn, br.lo, br.hi, br.glo, br.ghi);
    const gq = g(root);
    if (!(Math.abs(gq.x.n) <= Math.max(Math.abs(br.glo), Math.abs(br.ghi)))) {
      throw new CalcError(`${name}: no root, the expression jumps across zero`);
    }
    const h = 1e-6 * (Math.abs(root) || Math.abs(br.hi - br.lo) || 1);
    return { root, lo: br.lo, hi: br.hi, gq, slope: (gn(root + h) - gn(root - h)) / (2 * h) };
  });
  // linear errors: g(root) = 0 moves by dg, so the root moves by −dg/g'
  let c = null;
  if (gq.x.c && slope && isFinite(1 / slope)) {
    c = new Map();
    for (const [k, v] of gq.x.c) c.set(k, -v / slope);
  }
  const x = new UNum(root, c);
  if (MC.on && g(root).x.samples()) {
    const G = (xs) => {
      const r = g(new UNum(root, null, xs)).x;
      return r.samples() || new Float64Array(xs.length).fill(r.n);
    };
    x.s = solveSamples(G, root, Math.min(lo, hi), Math.max(lo, hi), slope, name);
  }
  return fr.mk(x);
}

// Gauss–Kronrod 15-point rule (QUADPACK): nodes, Kronrod weights, and the
// weights of the embedded 7-point Gauss rule (on nodes 1, 3, 5, 7)
const GK_X = [0.991455371120812639206854697526329, 0.949107912342758524526189684047851,
  0.864864423359769072789712788640926, 0.741531185599394439863864773280788,
  0.586087235467691130294144845693013, 0.405845151377397166906606412076961,
  0.207784955007898467600689403773245, 0];
const GK_WK = [0.022935322010529224963732008058970, 0.063092092629978553290700663189204,
  0.104790010322250183839876322541518, 0.140653259715525918745189590510238,
  0.169004726639267902826583426598550, 0.190350578064785409913256402421014,
  0.204432940075298892414161999234649, 0.209482141084727828012999174891714];
const GK_WG = [0.129484966168869693270611432679082, 0.279705391489276667901467771423780,
  0.381830050505118944950369775488975, 0.417959183673469387755102040816327];

function calcIntegrate(env, f, limits, name) {
  const fr = varFrame(env, limits, name);
  let [a, b] = fr.us, sign = 1;
  const at = (u) => f(fr.mk(u)).relative();
  if (a.n === b.n) return env.mul(at(isFinite(a.n) ? a : new UNum(0)), new Q(0, fr.d));
  if (!isFinite(a.n) || !isFinite(b.n)) {
    if (a.n > b.n) { [a, b] = [b, a]; sign = -1; }
  }
  const fn = (u) => at(u).x.n;

  // integration over t: x(t) and dx/dt as UNum, for t in [t0, t1]
  let X, J, t0 = 0, t1 = 1;
  if (isFinite(a.n) && isFinite(b.n)) {
    const w = b.sub(a);
    X = (t) => a.add(w.scale(t));
    J = () => w;
  } else {
    // infinite ranges: x = a + L t/(1 − t), with a length scale L where
    // |f(x)| x is largest
    const two = !isFinite(a.n) && !isFinite(b.n);
    const base = two ? 0 : isFinite(a.n) ? a.n : b.n;
    const dir = !isFinite(a.n) && !two ? -1 : 1;
    let L = Math.abs(base) || 1, best = 0;
    nominally(() => {
      for (let k = -40; k <= 40; k++) {
        const s = 10 ** k;
        let v;
        try {
          v = Math.abs(fn(base + dir * s)) + (two ? Math.abs(fn(base - s)) : 0);
        } catch { continue; }
        if (isFinite(v) && v * s > best) { best = v * s; L = s; }
      }
    });
    if (two) {
      t0 = -1;
      X = (t) => new UNum(L * t / (1 - t * t));
      J = (t) => new UNum(L * (1 + t * t) / (1 - t * t) ** 2);
    } else {
      const origin = isFinite(a.n) ? a : b;
      X = (t) => origin.add(dir * L * t / (1 - t));
      J = (t) => new UNum(L / (1 - t) ** 2);
    }
  }

  // one panel: the Kronrod sum as a quantity, its error estimate and ∫|f|
  let shown = null;
  const panel = (lo, hi) => {
    const c = (lo + hi) / 2, h = (hi - lo) / 2;
    let sum = null, rk = 0, rg = 0, rabs = 0;
    const vals = [];
    for (let i = 0; i < 8; i++) {
      for (const side of i < 7 ? [-1, 1] : [0]) {
        const t = c + side * h * GK_X[i];
        const x = X(t), j = J(t);
        if (!isFinite(x.n) || !isFinite(j.n)) continue;
        const q = at(x);
        shown = shown || q;
        const v = env.mul(q, new Q(j, fr.d));
        const y = v.x.n;
        if (!isFinite(y)) throw new CalcError(`${name}: the expression is not finite at a point of the range`);
        const term = new Q(v.x.scale(GK_WK[i] * h), v.d);
        sum = sum ? env.add(sum, term) : term;
        rk += GK_WK[i] * y;
        if (i % 2) rg += GK_WG[(i - 1) / 2] * y;
        else if (i === 7) rg += GK_WG[3] * y;
        rabs += GK_WK[i] * Math.abs(y);
        vals.push([i, y]);
      }
    }
    // QUADPACK's error estimate
    const mean = rk / 2;
    let rasc = 0;
    for (const [i, y] of vals) rasc += GK_WK[i] * Math.abs(y - mean);
    let err = Math.abs((rk - rg) * h);
    rasc *= Math.abs(h);
    if (rasc && err) err = rasc * Math.min(1, (200 * err / rasc) ** 1.5);
    err = Math.max(err, 50 * EPS * rabs * Math.abs(h));
    return { lo, hi, sum, value: rk * h, err, abs: rabs * Math.abs(h) };
  };

  // adaptive subdivision of the panel with the largest error
  const total = (ps, k) => ps.reduce((s, p) => s + p[k], 0);
  const panels = nominally(() => {
    const ps = [panel(t0, t1)];
    while (ps.length < 200) {
      const I = Math.abs(total(ps, "value")), err = total(ps, "err");
      if (err <= Math.max(1e-12 * I, 1e-14 * total(ps, "abs"))) break;
      let k = 0;
      for (let i = 1; i < ps.length; i++) if (ps[i].err > ps[k].err) k = i;
      const p = ps[k], m = (p.lo + p.hi) / 2;
      if (!(m > p.lo && m < p.hi)) break;
      ps.splice(k, 1, panel(p.lo, m), panel(m, p.hi));
    }
    return ps;
  });
  const I = total(panels, "value"), err = total(panels, "err");
  if (!(err <= Math.max(1e-6 * Math.abs(I), 1e-9 * total(panels, "abs")))) {
    throw new CalcError(`${name}: no convergence (the integral may diverge)`);
  }
  const sums = MC.on ? panels.map((p) => panel(p.lo, p.hi).sum) : panels.map((p) => p.sum);
  let r = sums.filter(Boolean).reduce((s, q) => env.add(s, q));
  if (sign < 0) r = env.neg(r);
  return keepShow(r, shown, fr.d);
}

function calcDiff(env, f, limits, name) {
  const [x0, step] = limits;
  const fr = varFrame(env, [x0], name);
  const u0 = fr.us[0];
  if (!isFinite(u0.n)) throw new CalcError(`${name}: the point must be finite`);
  if (step) env.checkCompatible(step, x0, name);
  const h = step ? Math.abs(step.x.n) : Math.abs(u0.n) * 1e-3 || 1e-3;
  if (!(h > 0 && isFinite(h))) throw new CalcError(`${name}: the step must be finite and not zero`);
  // five-point central difference, error O(h⁴)
  let s = null, q0 = null;
  for (const [k, w] of [[-2, 1], [-1, -8], [1, 8], [2, -1]]) {
    const q = f(fr.mk(u0.add(k * h))).relative();
    q0 = q0 || q;
    const t = new Q(q.x.scale(w), q.d);
    s = s ? env.add(s, t) : t;
  }
  return keepShow(env.div(s, new Q(12 * h, fr.d)), q0, fr.d);
}

// plot(f(x), x, a, b): the expression at n points, equally spaced, or in
// equal ratios when a and b are positive and at least a factor 100 apart;
// points where it fails or is not finite are left out (null)
function calcPlot(env, f, limits, { heads, xname, shown }) {
  const fr = varFrame(env, limits, "plot");
  const [a, b] = fr.us.map((u) => u.n);
  if (!isFinite(a) || !isFinite(b) || a === b) throw new CalcError("plot: the range must be finite and not empty");
  const n = MC.on ? 81 : 161;
  const logx = a > 0 && b > 0 && Math.max(a, b) / Math.min(a, b) >= 100;
  const xs = [], rows = [];
  let error = null;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const x = fr.mk(logx ? a * (b / a) ** t : a + (b - a) * t);
    xs.push(shown(x));
    try {
      const y = f(x);
      rows.push(Array.isArray(y) ? y : [y]);
    } catch (e) {
      if (!(e instanceof CalcError || e instanceof UnitError)) throw e;
      error = error || e;
      rows.push(null);
    }
  }
  const k = Math.max(0, ...rows.map((r) => (r ? r.length : 0)));
  if (!k) throw error || new CalcError("plot: nothing to plot");
  const series = Array.from({ length: k }, (_, j) => rows.map((r) => (r && r[j] && isFinite(r[j].x.n) ? r[j] : null)));
  return makePlot(env, xs, series, { heads: heads.length === k ? heads : null, xname });
}

// checks that the x values, and all the curves, have consistent units
function makePlot(env, xs, series, opts) {
  const same = (qs, what) => {
    const ok = qs.filter(Boolean);
    if (!ok.length) return;
    for (const q of ok) {
      if (!dimEq(q.d, ok[0].d)) throw new CalcError(`plot: the ${what} have different units: [${env.dimString(ok[0].d)}] and [${env.dimString(q.d)}]`);
    }
  };
  same(xs, "x values");
  same(series.flat(), "curves");
  if (!series.flat().some(Boolean)) throw new CalcError("plot: no finite values to plot");
  return new PlotData(xs, series, opts);
}

// sum(f(k), k, a, b): f at k = a, a + 1, …, b; a list f gives a list of sums
function calcSum(env, f, limits, name) {
  const [a, b] = limits.map((q, i) => {
    const k = env.checkPure(q, `${name} (${i ? "last" : "first"} index)`).n;
    if (!Number.isInteger(k)) throw new CalcError(`${name}: the first and last index must be whole numbers`);
    return k;
  });
  if (b - a >= 100000) throw new CalcError(`${name}: at most 100000 terms`);
  let s = null;
